version: "3.9"
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: qlgen
      POSTGRES_PASSWORD: qlgen_pass
      POSTGRES_DB: qlgen
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qlgen"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
